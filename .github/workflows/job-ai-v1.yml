name: Job AI V1

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  find-score-pitch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r job-ai-v1/requirements.txt

      - name: Find, score and pitch jobs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python job-ai-v1/run.py

      - name: Commit latest report
        run: |
          git config user.name "job-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add job-ai-v1/output/latest.json job-ai-v1/output/latest.md
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Update AI job match report"
          git push
