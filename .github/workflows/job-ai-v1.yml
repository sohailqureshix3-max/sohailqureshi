name: Job AI FINAL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  find-score-pitch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r job-ai-v1/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Find direct vacancies, verify, score and pitch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python job-ai-v1/run.py

      - name: Sync application tracker
        run: python job-ai-v1/sync_tracker.py

      - name: Resolve external employer ATS links
        run: python job-ai-v1/resolve_apply_links.py

      - name: Auto-apply score 75+ where supported
        env:
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          APPLICANT_FIRST_NAME: ${{ secrets.APPLICANT_FIRST_NAME }}
          APPLICANT_LAST_NAME: ${{ secrets.APPLICANT_LAST_NAME }}
          APPLICANT_LOCATION: ${{ secrets.APPLICANT_LOCATION }}
          APPLICANT_LINKEDIN: ${{ secrets.APPLICANT_LINKEDIN }}
          APPLICANT_PORTFOLIO: ${{ secrets.APPLICANT_PORTFOLIO }}
        run: python job-ai-v1/auto_apply.py

      - name: Commit latest report and tracker
        run: |
          git config user.name "job-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add job-ai-v1/output/ job-ai-v1/applications.json
          if git diff --cached --quiet; then
            echo "No report or tracker changes to commit"
            exit 0
          fi
          git commit -m "Update AI job report and application tracker"
          git push
