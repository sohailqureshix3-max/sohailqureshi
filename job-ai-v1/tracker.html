<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sohail Qureshi | Application & Feedback Tracker</title>
  <style>
    :root{--bg:#0a0f14;--panel:#131c25;--line:#263442;--text:#f4f7fa;--muted:#aab5c1;--accent:#55d6c9;--warn:#d7b25b;--bad:#e27b7b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}.wrap{width:min(1180px,calc(100% - 36px));margin:auto;padding:44px 0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.lead{color:var(--muted);max-width:850px}.nav a,.actions a{display:inline-block;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:28px 0}.card,.row{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.card strong{display:block;color:var(--accent);font-size:26px}.card span{font-size:12px;color:var(--muted)}.row{margin:12px 0}.head{display:flex;justify-content:space-between;gap:20px}.score{color:var(--accent);font-weight:900;font-size:22px}.meta,.small{color:var(--muted);font-size:13px}.status{display:inline-block;margin-top:7px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;text-transform:uppercase}.status.applied,.status.recruiter-replied,.status.interview,.status.offer{color:var(--accent)}.status.follow-up-due{color:var(--warn)}.status.rejected{color:var(--bad)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.box{background:#0e151c;border-radius:10px;padding:12px}.box b{display:block;margin-bottom:4px}.empty{padding:30px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top,.head{flex-direction:column}}@media(max-width:520px){.summary{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
<div class="top"><div><p class="eyebrow">Job AI · V2 Tracker</p><h1>Applications & Feedback</h1><p class="lead">This page separates recommended vacancies from jobs actually applied to. A vacancy is not considered applied unless its status says <b>Applied</b> or later.</p></div><div class="nav"><a href="./">Job Matches</a></div></div>
<section class="summary" id="summary"></section>
<section id="rows"><div class="empty">Loading tracker…</div></section>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slug=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function load(){try{const r=await fetch('./applications.json?ts='+Date.now());if(!r.ok)throw 0;const d=await r.json(),a=d.applications||[];const c=s=>a.filter(x=>x.status===s).length;const replied=a.filter(x=>['Recruiter Replied','Interview','Offer','Rejected'].includes(x.status)).length;document.getElementById('summary').innerHTML=`<div class="card"><strong>${a.length}</strong><span>Tracked opportunities</span></div><div class="card"><strong>${c('Applied')}</strong><span>Applied</span></div><div class="card"><strong>${replied}</strong><span>Employer feedback</span></div><div class="card"><strong>${c('Interview')}</strong><span>Interviews</span></div><div class="card"><strong>${c('Offer')}</strong><span>Offers</span></div>`;document.getElementById('rows').innerHTML=a.map(x=>`<article class="row"><div class="head"><div><h2>${esc(x.job_title)}</h2><div class="meta">${esc(x.company)} · ${esc(x.location)}</div><span class="status ${slug(x.status)}">${esc(x.status)}</span></div><div class="score">${esc(x.fit_score)}/100</div></div><div class="grid"><div class="box"><b>Application</b><div class="small">Applied: ${esc(x.applied_at||'Not yet')}</div><div class="small">Method: ${esc(x.application_method||'—')}</div><div class="small">Follow-up: ${esc(x.follow_up_due||'—')}</div></div><div class="box"><b>Latest feedback</b><div class="small">${esc(x.feedback_status||'No feedback')}</div><div>${esc(x.feedback_summary||'No recruiter or employer response recorded yet.')}</div><div class="small">${esc(x.last_feedback_at||'')}</div></div></div><div class="actions">${x.job_url?`<a href="${esc(x.job_url)}" target="_blank" rel="noopener">Open vacancy</a>`:''}</div></article>`).join('')||'<div class="empty">No opportunities tracked.</div>'}catch(e){document.getElementById('rows').innerHTML='<div class="empty">Tracker unavailable.</div>'}}load();
</script></main></body></html>
