<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sohail Qureshi | AI Job Outreach Engine</title>
  <style>
    :root{--bg:#0a0f14;--panel:#131c25;--line:#263442;--text:#f4f7fa;--muted:#aab5c1;--accent:#55d6c9}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}.wrap{width:min(1100px,calc(100% - 36px));margin:auto;padding:50px 0}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(38px,6vw,68px);line-height:1;margin:8px 0 14px}.lead{color:var(--muted);font-size:18px;max-width:800px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.card,.job{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.card strong{display:block;font-size:28px;color:var(--accent)}.card span{color:var(--muted);font-size:13px}.job{margin:15px 0}.job-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.score{font-size:26px;font-weight:900;color:var(--accent);white-space:nowrap}.meta{color:var(--muted);font-size:14px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;margin:4px 4px 0 0}.pitch{background:#0e151c;border-left:3px solid var(--accent);padding:14px;margin-top:14px;color:#d6dee6}.actions a{display:inline-block;margin:10px 8px 0 0;padding:9px 12px;border-radius:9px;border:1px solid var(--line);color:var(--text);text-decoration:none}.empty{padding:30px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:700px){.summary{grid-template-columns:1fr}.job-head{flex-direction:column}.wrap{padding-top:28px}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Job AI V1</p>
    <h1>Find. Score. Pitch.</h1>
    <p class="lead">Automated executive job discovery for Sohail Qureshi, focused on Operations, Fleet, Transport and Mobility leadership roles across the UAE and Saudi Arabia.</p>
    <section class="summary" id="summary"></section>
    <section id="jobs"><div class="empty">No report yet. Run the GitHub Action after adding the OPENAI_API_KEY repository secret.</div></section>
  </main>
<script>
async function load(){
  try{
    const r=await fetch('./output/latest.json?ts='+Date.now());
    if(!r.ok) throw new Error('No report');
    const d=await r.json();
    const s=d.summary||{};
    document.getElementById('summary').innerHTML=`
      <div class="card"><strong>${s.credible_jobs_found ?? d.jobs.length}</strong><span>Credible opportunities</span></div>
      <div class="card"><strong>${s.high_fit_count ?? 0}</strong><span>High-fit roles</span></div>
      <div class="card"><strong>${(s.searched_markets||[]).join(' · ') || 'UAE · KSA'}</strong><span>Markets searched</span></div>`;
    const jobs=(d.jobs||[]).map(j=>`<article class="job">
      <div class="job-head"><div><h2>${j.rank}. ${j.job_title}</h2><div class="meta">${j.company} · ${j.location} · Live confidence: ${j.live_confidence}</div></div><div class="score">${j.fit_score}/100</div></div>
      <div>${(j.why_fit||[]).map(x=>`<span class="pill">${x}</span>`).join('')}</div>
      <div class="pitch"><strong>${j.email_subject}</strong><br><br>${j.email_pitch}</div>
      <div class="actions">${j.job_url?`<a href="${j.job_url}" target="_blank">Open job</a>`:''}${j.source_url?`<a href="${j.source_url}" target="_blank">Source</a>`:''}</div>
    </article>`).join('');
    document.getElementById('jobs').innerHTML=jobs||'<div class="empty">No qualifying jobs found in the latest run.</div>';
  }catch(e){}
}
load();
</script>
</body>
</html>
